<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sertão em Mapa - Login</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <nav>
    <div class="nav-botoes">
      <a href="home.html"><button>Início</button></a>
      <a href="map.html"><button>Mapa</button></a>
      <a href="about.html"><button>Sobre</button></a>
    </div>
    <a href="login.html" class="btn-login-nav"><button class="ativo">Login</button></a>
  </nav>

  <main class="conteudo-pagina">
    <div class="login-container">
      <h2>Entrar</h2>
      <p>Bem-vindo ao Sertão em Mapa</p>

      <form id="form-login">
        <input type="text" id="usuario" placeholder="Usuário" required>
        <input type="password" id="senha" placeholder="Senha" required>
        <button type="button" class="btn-login" onclick="window.location.href='home.html'">Acessar Mapa</button>
      </form>

      <div class="registro-link">
        <p>Não tem uma conta? <a href="registro.html">Registre-se aqui</a></p>
      </div>
    </div>
  </main>

</body>
</html>
